[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-catalog"
version = "0.1.0"
description = "Standalone Agent Catalog service (published from shopping-cli extraction plan, phase 2)"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
api = ["uvicorn", "fastapi"]
dev = ["ruff", "mypy"]

[project.scripts]
kiwi-catalog-api = "kiwi_catalog.scripts.kiwi_catalog_api:main"
kiwi-catalog = "kiwi_catalog.cli:main"

[tool.setuptools.packages.find]
include = ["kiwi_catalog*"]

[tool.setuptools.package-data]
kiwi_catalog = ["py.typed"]
