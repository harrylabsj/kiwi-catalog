[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-catalog"
version = "0.1.0"
description = "Standalone Agent Catalog service (published from shopping-cli extraction plan, phase 2)"
readme = "README.md"
requires-python = ">=3.11"
# cryptography：token 加密存储（Fernet）——标准库无可逆加密，商家凭证
# 安全存储的必要例外（docs §account）
# jsonschema：register-input 契约硬拒（CD #8，schema 落盘 + additionalProperties:false）
dependencies = ["cryptography", "jsonschema"]
license = {file = "LICENSE"}

[project.optional-dependencies]
api = ["fastapi>=0.141.1", "uvicorn>=0.27"]
dev = ["httpx>=0.28", "mypy", "pytest", "ruff", "types-jsonschema"]

[tool.uv]
# Keep the optional API stack above the currently published Starlette security
# floor while retaining an upper bound for deliberate compatibility upgrades.
constraint-dependencies = ["fastapi>=0.141.1,<0.142", "starlette>=1.3.1,<1.7", "uvicorn<0.36"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
kiwi-catalog-api = "kiwi_catalog.scripts.kiwi_catalog_api:main"
kiwi-catalog = "kiwi_catalog.cli:main"

[tool.setuptools.packages.find]
include = ["kiwi_catalog*"]

[tool.setuptools.package-data]
kiwi_catalog = ["py.typed"]
"kiwi_catalog.contracts" = ["*.json"]
