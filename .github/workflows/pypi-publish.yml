# PyPI 发布由 harrylabsj/kiwi 仓库的受保护组合发布工作流独占：
#   .github/workflows/portfolio-release.yml（环境 `kiwi-release`，含人工
#   审批 reviewer）。那是唯一允许向 PyPI 发布 kiwi-catalog 包的路径。
#
# 本工作流只是 release tag（v*）上的纯质量门禁：与 ci.yml 同一套命令
# （ruff + mypy + pytest），绝不发布。请同时在 PyPI 项目设置中删除本仓库
# （harrylabsj/kiwi-catalog、workflow pypi-publish.yml）的 Trusted Publisher
# 映射，使这里任何工作流都无法铸造可用于发布 PyPI 的 OIDC token。
name: pypi-publish (quality-only; publishing owned by kiwi portfolio release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==0.10.6"
      - run: uv run --locked python -m ruff check kiwi_catalog tests scripts
      - run: uv run --locked python -m mypy kiwi_catalog
      - run: uv run --locked python -m pytest tests/ -q
