# PyPI trusted publishing (OIDC) — 无 PYPI_API_TOKEN。
#
# 前置条件：PyPI 项目设置 → Publishing → Add trusted publisher
#   GitHub repository: harrylabsj/kiwi-catalog
#   Workflow name: pypi-publish.yml
name: pypi-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # PyPI Trusted Publisher

jobs:
  quality:
    # 审查 P3：发布前必须过完整质量门禁（此前 tag push 直接 publish——
    # GitHub Actions 无跨 workflow 依赖，CI 未绿也能发布任意 commit 构建）。
    # 与 ci.yml 同一套命令（ruff + mypy + pytest），防止"测试红照发"。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv run --locked python -m ruff check kiwi_catalog tests scripts
      - run: uv run --locked python -m mypy kiwi_catalog
      - run: uv run --locked python -m pytest tests/ -q

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          trusted-publishing: always
