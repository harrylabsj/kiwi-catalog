name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip "uv==0.10.6"
      - run: uv sync --locked --extra api --extra dev
      - run: uv run --locked python scripts/verify_contract_lock.py
      - run: uv run --locked python -m ruff check kiwi_catalog tests scripts
      - run: uv run --locked python -m mypy kiwi_catalog
      - run: uv run --locked python -m pytest -q
