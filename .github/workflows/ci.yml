name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[api,dev]" pytest
      - run: python scripts/verify_contract_lock.py
      - run: python -m ruff check kiwi_catalog tests scripts
      - run: python -m mypy kiwi_catalog
      - run: python -m pytest -q
