name: Feature request
description: 提出新功能或改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please keep the scope focused and, when the feature touches the wire contract, reference the authoritative kiwi schema.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Avoid describing a specific solution here.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behavior, interface, or endpoint would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why were they rejected?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would we verify that the feature works as intended?
  - type: checkboxes
    id: contract
    attributes:
      label: Contract impact
      description: Confirm whether the wire contract is affected.
      options:
        - label: "This feature changes the wire contract (agent-record schema / DTO). If so, the kiwi repo schema must change first."
          required: false
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: "This request contains no credentials, tokens, personal data, or production endpoints."
          required: true
