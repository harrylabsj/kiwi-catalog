name: Bug report
description: 提交缺陷报告以帮助改进 kiwi-catalog
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Before submitting, please:
        - Search existing issues to avoid duplicates.
        - Remove all credentials, tokens, personal data, production endpoints, and exploit details from the issue body.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Be specific and concise.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Start the service with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full error/traceback if available, with all secrets redacted.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area is affected?
      options:
        - API / v1 endpoints
        - Portal / accounts / tokens
        - Verification / discovery
        - Database / migrations
        - Deploy / CI
        - Docs / contracts
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which kiwi-catalog version or commit did you run?
      placeholder: "e.g. 0.1.0 or a full 40-character commit SHA"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (environment, deployment topology, redacted logs).
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      description: By submitting this issue you confirm
      options:
        - label: "I have removed all credentials, tokens, personal data, and production endpoints."
          required: true
